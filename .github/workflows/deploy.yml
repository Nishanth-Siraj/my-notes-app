name: Deploy to Render

# Triggers a Render deploy on every push (or merged PR) to main, then waits
# until the live service reports healthy. Needs one repository secret:
#   RENDER_DEPLOY_HOOK  -> Render service > Settings > Deploy Hook URL
# Optional secret:
#   RENDER_SERVICE_URL  -> e.g. https://my-notes-app-erwg.onrender.com (for the health wait)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set (Render > service > Settings > Deploy Hook)"; exit 1
          fi
          code=$(curl -s -o /tmp/hook.json -w '%{http_code}' -X POST "$HOOK")
          echo "Render responded $code"; cat /tmp/hook.json; echo
          [ "$code" = "200" ] || [ "$code" = "201" ]

      - name: Wait until this commit is live
        env:
          URL: ${{ secrets.RENDER_SERVICE_URL }}
          WANT: ${{ github.sha }}
        run: |
          if [ -z "$URL" ]; then echo "RENDER_SERVICE_URL not set; skipping wait"; exit 0; fi
          echo "Waiting for $URL/healthz to report commit $WANT ..."
          # The old version keeps serving while Render builds, so poll until /healthz
          # returns the commit we just pushed (up to ~15 minutes).
          for i in $(seq 1 60); do
            got=$(curl -fsS -m 20 "$URL/healthz" 2>/dev/null | sed -n 's/.*"commit": *"\([^"]*\)".*/\1/p')
            if [ "$got" = "$WANT" ]; then echo "Live: $got after ~$((i*15))s"; exit 0; fi
            sleep 15
          done
          echo "::error::Commit $WANT not live after ~15 minutes (last seen: ${got:-none}). Check the Render dashboard."
          exit 1
