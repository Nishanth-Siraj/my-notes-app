<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#232f3e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Azazel">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
  <link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico">
  <title>{% block title %}Azazel{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">Azazel</a>
    <nav class="topnav">
      <a href="/" class="navlink {% if nav == 'notes' %}active{% endif %}"><i data-lucide="file-text" class="nav-icon"></i>Notes</a>
      <a href="/quiz" class="navlink {% if nav == 'quiz' %}active{% endif %}"><i data-lucide="layers" class="nav-icon"></i>Quiz</a>
      {% if nav == 'quiz' %}
      <a href="/quiz/add" class="navlink nav-add"><i data-lucide="plus" class="nav-icon"></i>Card</a>
      {% else %}
      <a href="/notes/new" class="navlink nav-add"><i data-lucide="plus" class="nav-icon"></i>Note</a>
      {% endif %}
      {% if has_password %}
      <form method="post" action="/logout" class="inline"><button class="linkbtn" type="submit"><i data-lucide="log-out" class="btn-icon"></i>Log out</button></form>
      {% endif %}
    </nav>
  </div>
</header>

<main class="container {% block containerclass %}{% endblock %}">
  {% block content %}{% endblock %}
</main>

<!-- Image viewer -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-bar">
    <div class="lb-title" id="lb-title"></div>
    <button class="lb-btn" id="lb-zoom-out" title="Zoom out (-)">&minus;</button>
    <div class="lb-zoom" id="lb-zoom-level">100%</div>
    <button class="lb-btn" id="lb-zoom-in" title="Zoom in (+)">+</button>
    <button class="lb-btn" id="lb-fit" title="Fit (F)">Fit</button>
    <button class="lb-btn" id="lb-actual" title="Actual size (1)">1:1</button>
    <a class="lb-btn" id="lb-newtab" href="#" target="_blank" rel="noopener">New tab</a>
    <button class="lb-btn primary" id="lb-close" title="Close (Esc)">&times;</button>
  </div>
  <div class="lb-stage" id="lb-stage"><img id="lb-img" src="" alt="" draggable="false"></div>
  <div class="lb-foot">Scroll to zoom &middot; drag to pan &middot; double-click to toggle &middot; Esc to close</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/mhchem.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/copy-tex.min.js"></script>
<script src="{{ url_for('static', path='common.js') }}"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
{% block scripts %}{% endblock %}
<script>if(window.lucide)lucide.createIcons();</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');</script>
</body>
</html>
