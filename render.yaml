# Render blueprint: https://render.com/docs/blueprint-spec
# Connect this repo on Render, pick "Blueprint", and it creates the service.
# Set DATABASE_URL (Neon/Supabase Postgres) and NOTES_PASSWORD in the dashboard.
services:
  - type: web
    name: notes
    runtime: docker
    plan: free
    rootDir: notes_app
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NOTES_PASSWORD
        sync: false
      - key: NOTES_SECRET
        generateValue: true
